name: Build iOS

# شغّله يدوي: تاب Actions > Build iOS > Run workflow
# من غير أي Secrets: بيبني نسخة تجريبية (Simulator) تثبت إن الكود بيتبني على iOS.
# مع Secrets حساب Apple Developer: بيطلّع ملف IPA متوقّع، ولو ضفت مفتاح App Store Connect بيرفعه TestFlight لوحده.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend/voucher
    env:
      HAS_SIGNING: ${{ secrets.IOS_CERT_P12 != '' && secrets.IOS_PROFILE_B64 != '' && secrets.IOS_TEAM_ID != '' }}
      HAS_ASC: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' }}
      BUNDLE_ID: com.vevoucher.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save @capacitor/ios@^7.0.0

      - name: Build web app
        run: npm run build

      - name: Create iOS project
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          node scripts/patch-ios.cjs
          npx cap sync ios

      # ===== من غير توقيع: نسخة Simulator للتأكد إن البناء شغال =====
      - name: Build for Simulator (no signing)
        if: env.HAS_SIGNING != 'true'
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/frontend/voucher/ve-voucher-simulator.zip" App.app

      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING != 'true'
        with:
          name: ve-voucher-ios-simulator
          path: frontend/voucher/ve-voucher-simulator.zip

      # ===== مع توقيع Apple: IPA حقيقي =====
      - name: Import certificate and profile
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.IOS_CERT_P12 }}
          CERT_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "ci" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "ci" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "ci" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/p.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/p.mobileprovision" > "$RUNNER_TEMP/p.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/p.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/p.plist")
          cp "$RUNNER_TEMP/p.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          # نوع التوزيع من البروفايل: app-store (TestFlight) أو ad-hoc أو development
          if /usr/libexec/PlistBuddy -c "Print ProvisionsAllDevices" "$RUNNER_TEMP/p.plist" >/dev/null 2>&1; then METHOD=enterprise
          elif /usr/libexec/PlistBuddy -c "Print ProvisionedDevices" "$RUNNER_TEMP/p.plist" >/dev/null 2>&1; then
            if [ "$(/usr/libexec/PlistBuddy -c 'Print Entitlements:get-task-allow' "$RUNNER_TEMP/p.plist")" = "true" ]; then METHOD=development; else METHOD=ad-hoc; fi
          else METHOD=app-store; fi
          echo "EXPORT_METHOD=$METHOD" >> "$GITHUB_ENV"

      - name: Archive and export IPA
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CODE_SIGN_IDENTITY="Apple Distribution" archive
          cat > build/ExportOptions.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist build/ExportOptions.plist -exportPath build/ipa
          cp build/ipa/*.ipa ve-voucher.ipa

      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: ve-voucher-ipa
          path: frontend/voucher/ve-voucher.ipa

      # رفع تلقائي لـ TestFlight (اختياري: محتاج مفتاح App Store Connect API)
      - name: Upload to TestFlight
        if: env.HAS_SIGNING == 'true' && env.HAS_ASC == 'true' && env.EXPORT_METHOD == 'app-store'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f ve-voucher.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
